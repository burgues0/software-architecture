syntax = "proto3";

package filmes;

service FilmeService {
    rpc ListarFilmes(ListarFilmesRequest) returns (ListarFilmesResponse);
    rpc ObterFilmePorId(ObterFilmePorIdRequest) returns (ObterFilmePorIdResponse);
    rpc CriarFilme(CriarFilmeRequest) returns (CriarFilmeResponse);
    rpc AtualizarFilme(AtualizarFilmeRequest) returns (AtualizarFilmeResponse);
    rpc DeletarFilme(DeletarFilmeRequest) returns (DeletarFilmeResponse);
    rpc ListarAtoresDoFilme(ListarAtoresDoFilmeRequest) returns (ListarAtoresDoFilmeResponse);
    rpc AdicionarAtorAoFilme(AdicionarAtorAoFilmeRequest) returns (AdicionarAtorAoFilmeResponse);
}

message Filme {
    string id = 1;
    string titulo = 2;
    int32 ano_lancamento = 3;
    string genero_id = 4;
    repeated string ator_ids = 5;
}

message Ator {
    string id = 1;
    string nome = 2;
    string data_nascimento = 3;
}

message ListarFilmesRequest {}

message ListarFilmesResponse {
    repeated Filme filmes = 1;
}

message ObterFilmePorIdRequest {
    string id = 1;
}

message ObterFilmePorIdResponse {
    Filme filme = 1;
}

message CriarFilmeRequest {
    string titulo = 1;
    int32 ano_lancamento = 2;
    string genero_id = 3;
}

message CriarFilmeResponse {
    Filme filme = 1;
}

message AtualizarFilmeRequest {
    string id = 1;
    string titulo = 2;
    int32 ano_lancamento = 3;
    string genero_id = 4;
}

message AtualizarFilmeResponse {
    Filme filme = 1;
}

message DeletarFilmeRequest {
    string id = 1;
}

message DeletarFilmeResponse {
    bool success = 1;
}

message ListarAtoresDoFilmeRequest {
    string filme_id = 1;
}

message ListarAtoresDoFilmeResponse {
    repeated Ator atores = 1;
}

message AdicionarAtorAoFilmeRequest {
    string filme_id = 1;
    string ator_id = 2;
}

message AdicionarAtorAoFilmeResponse {
    bool success = 1;
}